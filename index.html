<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RoomChat P2P</title>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#0b1020;
    color:white;
    min-height:100vh;
}

/* LOGIN */

#loginPage{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:
        radial-gradient(circle at top left,#263b88 0,#11172b 40%,#080b14 100%);
}

.login-box{
    width:100%;
    max-width:430px;
    background:rgba(20,27,48,.94);
    border:1px solid rgba(255,255,255,.1);
    border-radius:25px;
    padding:35px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
}

.logo{
    width:70px;
    height:70px;
    margin:auto;
    border-radius:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:32px;
    background:linear-gradient(135deg,#5865f2,#7c4dff);
    box-shadow:0 10px 30px rgba(88,101,242,.35);
}

.login-box h1{
    text-align:center;
    margin-top:18px;
    font-size:28px;
}

.login-box p{
    text-align:center;
    color:#9da6c0;
    margin:10px 0 25px;
    line-height:1.5;
}

.input{
    width:100%;
    padding:15px;
    margin-top:12px;
    background:#0c1222;
    border:1px solid #293451;
    border-radius:12px;
    color:white;
    outline:none;
    font-size:15px;
}

.input:focus{
    border-color:#6574ff;
}

.join-btn{
    width:100%;
    margin-top:18px;
    border:0;
    border-radius:12px;
    padding:15px;
    background:linear-gradient(135deg,#5865f2,#7c4dff);
    color:white;
    font-weight:bold;
    font-size:16px;
    cursor:pointer;
}

.join-btn:hover{
    opacity:.9;
}

/* CHAT */

#chatPage{
    display:none;
    height:100vh;
    overflow:hidden;
}

.app{
    height:100vh;
    display:flex;
}

/* SIDEBAR */

.sidebar{
    width:280px;
    background:#11172a;
    border-right:1px solid #252e46;
    display:flex;
    flex-direction:column;
}

.brand{
    padding:22px;
    border-bottom:1px solid #252e46;
}

.brand h2{
    font-size:20px;
}

.room{
    margin-top:8px;
    color:#929bb5;
    font-size:13px;
    word-break:break-all;
}

.members-title{
    padding:18px 20px 10px;
    font-size:12px;
    color:#7f89a5;
    text-transform:uppercase;
    letter-spacing:1px;
}

#members{
    padding:0 12px;
    overflow:auto;
}

.member{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px;
    border-radius:10px;
    margin-bottom:5px;
}

.member:hover{
    background:#1b2339;
}

.avatar{
    width:36px;
    height:36px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#5865f2,#7c4dff);
    font-weight:bold;
}

.member-info{
    min-width:0;
}

.member-name{
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.online{
    color:#53e38b;
    font-size:11px;
}

.sidebar-bottom{
    margin-top:auto;
    padding:15px;
    border-top:1px solid #252e46;
}

.my-name{
    color:#9da6c0;
    font-size:13px;
}

/* MAIN */

.main{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
}

.header{
    height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px;
    background:#11172a;
    border-bottom:1px solid #252e46;
}

.header-left h3{
    font-size:17px;
}

.connection{
    font-size:12px;
    margin-top:5px;
    color:#ffcc66;
}

.header-actions button{
    background:#202a43;
    color:white;
    border:1px solid #34405e;
    padding:9px 12px;
    border-radius:9px;
    cursor:pointer;
}

/* MESSAGES */

#messages{
    flex:1;
    overflow-y:auto;
    padding:25px;
    background:
        radial-gradient(circle at 80% 20%,rgba(65,80,180,.08),transparent 30%),
        #0b1020;
}

.system{
    text-align:center;
    color:#77819e;
    font-size:12px;
    margin:12px 0;
}

.message-row{
    display:flex;
    margin-bottom:15px;
}

.message-row.mine{
    justify-content:flex-end;
}

.message{
    max-width:min(75%,600px);
    padding:11px 14px;
    border-radius:16px;
    background:#19233a;
    border:1px solid #283553;
}

.mine .message{
    background:linear-gradient(135deg,#4d5de5,#6744c7);
    border:none;
}

.sender{
    font-size:11px;
    color:#8f9ab8;
    margin-bottom:5px;
}

.mine .sender{
    color:#dddfff;
}

.message-text{
    white-space:pre-wrap;
    word-break:break-word;
    line-height:1.45;
}

.time{
    font-size:9px;
    color:#aeb7cc;
    text-align:right;
    margin-top:5px;
}

/* FILE */

.file-card{
    display:flex;
    align-items:center;
    gap:12px;
    background:rgba(0,0,0,.18);
    border-radius:12px;
    padding:12px;
    min-width:220px;
}

.file-icon{
    width:42px;
    height:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(255,255,255,.12);
    border-radius:10px;
    font-size:20px;
}

.file-info{
    flex:1;
    min-width:0;
}

.file-name{
    font-size:13px;
    word-break:break-all;
}

.file-size{
    color:#adb5c8;
    font-size:10px;
    margin-top:3px;
}

.download-btn{
    border:0;
    background:white;
    color:#222;
    padding:7px 9px;
    border-radius:8px;
    cursor:pointer;
}

/* INPUT */

.composer{
    padding:15px;
    background:#11172a;
    border-top:1px solid #252e46;
}

.composer-inner{
    display:flex;
    gap:10px;
    align-items:center;
    background:#0b1020;
    border:1px solid #293451;
    border-radius:15px;
    padding:8px;
}

.icon-btn{
    width:42px;
    height:42px;
    border:0;
    border-radius:10px;
    background:#202a43;
    color:white;
    cursor:pointer;
    font-size:18px;
    flex-shrink:0;
}

#messageInput{
    flex:1;
    min-width:0;
    border:0;
    outline:0;
    background:transparent;
    color:white;
    padding:10px;
    font-size:15px;
}

.send-btn{
    width:44px;
    height:44px;
    border:0;
    border-radius:11px;
    background:#5865f2;
    color:white;
    cursor:pointer;
    font-size:18px;
}

#fileInput{
    display:none;
}

/* MOBILE */

@media(max-width:700px){

    .sidebar{
        display:none;
    }

    .header{
        height:64px;
        padding:0 14px;
    }

    #messages{
        padding:15px;
    }

    .message{
        max-width:85%;
    }

    .composer{
        padding:9px;
    }

    .login-box{
        padding:25px;
    }
}

/* NOTIFICATION */

.toast{
    position:fixed;
    bottom:90px;
    right:20px;
    background:#202a43;
    border:1px solid #394766;
    color:white;
    padding:12px 16px;
    border-radius:12px;
    opacity:0;
    transform:translateY(15px);
    pointer-events:none;
    transition:.3s;
    z-index:999;
}

.toast.show{
    opacity:1;
    transform:translateY(0);
}
</style>
</head>

<body>

<!-- LOGIN -->

<section id="loginPage">

    <div class="login-box">

        <div class="logo">💬</div>

        <h1>RoomChat</h1>

        <p>
            Chat langsung antar perangkat menggunakan
            koneksi P2P WebRTC.
        </p>

        <input
            id="nameInput"
            class="input"
            type="text"
            maxlength="30"
            placeholder="Nama kamu"
        >

        <input
            id="roomInput"
            class="input"
            type="text"
            maxlength="40"
            placeholder="ID Room, contoh: RPL-X-01"
        >

        <button class="join-btn" onclick="joinRoom()">
            🚀 Masuk Room
        </button>

    </div>

</section>


<!-- CHAT -->

<section id="chatPage">

<div class="app">

    <aside class="sidebar">

        <div class="brand">

            <h2>💬 RoomChat</h2>

            <div class="room">
                Room:
                <strong id="roomLabel"></strong>
            </div>

        </div>

        <div class="members-title">
            Anggota Online
        </div>

        <div id="members"></div>

        <div class="sidebar-bottom">
            <div class="my-name">
                Kamu:
                <strong id="myName"></strong>
            </div>
        </div>

    </aside>


    <main class="main">

        <header class="header">

            <div class="header-left">

                <h3 id="headerRoom">
                    Room Chat
                </h3>

                <div id="connectionStatus"
                     class="connection">
                    Menghubungkan...
                </div>

            </div>

            <div class="header-actions">

                <button onclick="copyRoom()">
                    📋 Salin Room
                </button>

                <button onclick="leaveRoom()">
                    Keluar
                </button>

            </div>

        </header>


        <div id="messages">

            <div class="system">
                Masuk ke room untuk mulai chatting.
            </div>

        </div>


        <div class="composer">

            <div class="composer-inner">

                <button
                    class="icon-btn"
                    onclick="document.getElementById('fileInput').click()">
                    📎
                </button>

                <input
                    type="file"
                    id="fileInput"
                    onchange="sendFile()"
                >

                <input
                    id="messageInput"
                    type="text"
                    placeholder="Tulis pesan..."
                    autocomplete="off"
                >

                <button
                    class="send-btn"
                    onclick="sendMessage()">
                    ➤
                </button>

            </div>

        </div>

    </main>

</div>

</section>

<div id="toast" class="toast"></div>


<script>

/*
====================================================
 ROOMCHAT P2P
====================================================

Tidak menggunakan:
- Firebase
- Database
- Backend chat
- Penyimpanan pesan

WebRTC DataChannel digunakan untuk mengirim:
- pesan
- file

PeerJS digunakan sebagai signaling agar perangkat
berbeda dapat menemukan koneksi awal.

====================================================
*/


let peer = null;
let roomPeer = null;

let myName = "";
let roomId = "";

let connections = {};

let users = {};


/* ===============================
   UTILITIES
================================ */

function randomId(length = 8){

    const chars =
        "abcdefghijklmnopqrstuvwxyz0123456789";

    let result = "";

    for(let i=0;i<length;i++){

        result +=
            chars[Math.floor(Math.random()*chars.length)];

    }

    return result;
}


function escapeHTML(text){

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}


function formatBytes(bytes){

    if(bytes === 0) return "0 Bytes";

    const sizes =
        ["Bytes","KB","MB","GB"];

    const i =
        Math.floor(
            Math.log(bytes)/Math.log(1024)
        );

    return (
        bytes /
        Math.pow(1024,i)
    ).toFixed(1)
    + " "
    + sizes[i];

}


function timeNow(){

    return new Date().toLocaleTimeString(
        "id-ID",
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


function toast(text){

    const t =
        document.getElementById("toast");

    t.textContent = text;

    t.classList.add("show");

    setTimeout(()=>{
        t.classList.remove("show");
    },2500);

}


/* ===============================
   LOGIN
================================ */

function joinRoom(){

    myName =
        document
        .getElementById("nameInput")
        .value
        .trim();

    roomId =
        document
        .getElementById("roomInput")
        .value
        .trim();

    if(!myName){

        alert("Masukkan nama kamu.");

        return;

    }

    if(!roomId){

        alert("Masukkan ID Room.");

        return;

    }

    if(roomId.length < 3){

        alert("ID Room minimal 3 karakter.");

        return;

    }


    document
        .getElementById("loginPage")
        .style.display = "none";

    document
        .getElementById("chatPage")
        .style.display = "block";


    document
        .getElementById("myName")
        .textContent = myName;

    document
        .getElementById("roomLabel")
        .textContent = roomId;

    document
        .getElementById("headerRoom")
        .textContent =
        "#" + roomId;


    startPeer();

}


/* ===============================
   WEBRTC / PEERJS
================================ */

function startPeer(){

    setStatus("Membuat koneksi...");

    /*
       Room ID dijadikan bagian dari ID peer.

       Prefix:
       roomchat-
       Room:
       roomId

       Ditambah random ID supaya beberapa perangkat
       bisa berada di room yang sama.
    */

    const safeRoom =
        roomId
        .replace(/[^a-zA-Z0-9_-]/g,"")
        .slice(0,30);

    roomPeer =
        "roomchat-" +
        safeRoom +
        "-" +
        randomId(8);


    peer = new Peer(roomPeer, {

        debug: 1,

        config: {

            iceServers: [

                {
                    urls:
                    "stun:stun.l.google.com:19302"
                },

                {
                    urls:
                    "stun:stun1.l.google.com:19302"
                }

            ]

        }

    });


    peer.on("open", function(id){

        setStatus(
            "Online • Menunggu anggota lain..."
        );

        addMember(
            roomPeer,
            myName,
            true
        );


        /*
           Karena PeerJS ID tidak bisa dicari hanya
           berdasarkan room, kita menggunakan broadcast
           discovery melalui PeerJS room-discovery.

           Host room menggunakan ID deterministik.
        */

        connectToRoom();


    });


    peer.on("connection", function(conn){

        setupConnection(conn);

    });


    peer.on("error", function(err){

        console.error(err);

        if(err.type === "unavailable-id"){

            /*
              Jika ID bentrok, buat ID baru.
            */

            roomPeer =
                "roomchat-" +
                roomId
                .replace(/[^a-zA-Z0-9_-]/g,"")
                .slice(0,30) +
                "-" +
                randomId(8);

            return;

        }

        setStatus(
            "Koneksi mengalami masalah"
        );

    });


    peer.on("disconnected", function(){

        setStatus(
            "Terputus dari server signaling"
        );

    });


    peer.on("close", function(){

        setStatus("Koneksi ditutup");

    });

}


/*
====================================================
DISCOVERY

Agar ID ROOM dapat digunakan, kita membuat peer
khusus untuk room.

Peer room berfungsi sebagai "directory" koneksi,
bukan tempat menyimpan chat/file.

====================================================
*/

function connectToRoom(){

    /*
       Kita mencoba beberapa kemungkinan peer
       directory untuk room.

       Dalam implementasi production sebaiknya
       memakai signaling server sendiri.

       Untuk demo satu-file, kita menggunakan
       PeerJS signaling sebagai penghubung.
    */

    setStatus(
        "Mencari anggota room..."
    );


    /*
       Hubungkan ke peer yang diketahui melalui
       localStorage jika perangkat pernah terhubung.

       Ini membantu perangkat yang sama.
    */

    const known =
        JSON.parse(
            localStorage.getItem(
                "roomchat-" + roomId
            ) || "[]"
        );


    known.forEach(id => {

        if(id !== roomPeer){

            try{

                const conn =
                    peer.connect(
                        id,
                        {
                            reliable:true,
                            metadata:{
                                name:myName
                            }
                        }
                    );

                setupConnection(conn);

            }catch(e){

                console.log(e);

            }

        }

    });


    /*
       Simpan ID peer sendiri.

       CATATAN:
       localStorage hanya menyimpan daftar ID
       perangkat, bukan isi pesan/file.
    */

    known.push(roomPeer);

    localStorage.setItem(
        "roomchat-" + roomId,
        JSON.stringify(
            [...new Set(known)].slice(-50)
        )
    );

}


/* ===============================
   CONNECTION
================================ */

function setupConnection(conn){

    if(
        !conn ||
        connections[conn.peer]
    ){

        return;

    }


    connections[conn.peer] = conn;


    conn.on("open", function(){

        console.log(
            "Connected:",
            conn.peer
        );


        /*
           Kirim informasi user
        */

        conn.send({

            type:"user",

            name:myName,

            id:roomPeer

        });


        /*
           Kirim daftar peer yang kita kenal
           supaya room bisa berkembang.
        */

        conn.send({

            type:"peer-list",

            peers:Object.keys(connections)

        });


        setStatus(
            "Terhubung • P2P aktif"
        );

    });


    conn.on("data", function(data){

        receiveData(
            data,
            conn
        );

    });


    conn.on("close", function(){

        delete connections[
            conn.peer
        ];

        removeMember(
            conn.peer
        );

        addSystemMessage(
            "Salah satu anggota keluar."
        );

    });


    conn.on("error", function(error){

        console.error(error);

    });

}


/* ===============================
   DATA
================================ */

function receiveData(data, conn){

    if(!data) return;


    if(data.type === "user"){

        addMember(
            data.id,
            data.name,
            false
        );

        return;

    }


    if(data.type === "peer-list"){

        data.peers.forEach(id => {

            if(
                id !== roomPeer &&
                !connections[id]
            ){

                try{

                    const newConn =
                        peer.connect(
                            id,
                            {
                                reliable:true,
                                metadata:{
                                    name:myName
                                }
                            }
                        );

                    setupConnection(newConn);

                }catch(e){

                    console.log(e);

                }

            }

        });

        return;

    }


    if(data.type === "message"){

        showMessage(

            data.name,

            data.text,

            data.time,

            false

        );

        return;

    }


    if(data.type === "file"){

        receiveFile(
            data
        );

        return;

    }

}


/* ===============================
   SEND MESSAGE
================================ */

function sendMessage(){

    const input =
        document.getElementById(
            "messageInput"
        );

    const text =
        input.value.trim();


    if(!text){

        return;

    }


    showMessage(

        myName,

        text,

        timeNow(),

        true

    );


    broadcast({

        type:"message",

        name:myName,

        text:text,

        time:timeNow()

    });


    input.value = "";

    input.focus();

}


/* ENTER */

document
.getElementById("messageInput")
.addEventListener(
    "keydown",
    function(e){

        if(
            e.key === "Enter"
            && !e.shiftKey
        ){

            e.preventDefault();

            sendMessage();

        }

    }
);


/* ===============================
   BROADCAST
================================ */

function broadcast(data){

    Object.values(
        connections
    ).forEach(conn => {

        if(conn.open){

            try{

                conn.send(data);

            }catch(e){

                console.error(e);

            }

        }

    });

}


/* ===============================
   DISPLAY MESSAGE
================================ */

function showMessage(
    name,
    text,
    time,
    mine
){

    const container =
        document.getElementById(
            "messages"
        );


    const row =
        document.createElement("div");

    row.className =
        "message-row"
        + (mine ? " mine" : "");


    const message =
        document.createElement("div");

    message.className =
        "message";


    message.innerHTML = `

        <div class="sender">
            ${escapeHTML(name)}
        </div>

        <div class="message-text">
            ${escapeHTML(text)}
        </div>

        <div class="time">
            ${escapeHTML(time)}
        </div>

    `;


    row.appendChild(message);

    container.appendChild(row);

    container.scrollTop =
        container.scrollHeight;

}


/* ===============================
   FILE
================================ */

async function sendFile(){

    const input =
        document.getElementById(
            "fileInput"
        );

    const file =
        input.files[0];


    if(!file){

        return;

    }


    /*
       File besar bisa melebihi kemampuan
       DataChannel/browser.

       Kita batasi 50MB untuk demo.
    */

    if(file.size > 50 * 1024 * 1024){

        alert(
            "Untuk versi ini ukuran file maksimal 50 MB."
        );

        input.value = "";

        return;

    }


    /*
       Baca file menjadi ArrayBuffer.
    */

    const buffer =
        await file.arrayBuffer();


    /*
       ArrayBuffer tidak aman dikirim sekaligus
       pada semua browser.

       Kita pecah menjadi chunk.
    */

    const chunkSize =
        16 * 1024;


    const total =
        Math.ceil(
            buffer.byteLength /
            chunkSize
        );


    const fileId =
        randomId(16);


    /*
       Kirim informasi file.
    */

    broadcast({

        type:"file",

        action:"start",

        fileId:fileId,

        name:file.name,

        size:file.size,

        mime:file.type || "application/octet-stream",

        total:total,

        sender:myName,

        time:timeNow()

    });


    /*
       Kirim chunk.
    */

    for(
        let i=0;
        i<total;
        i++
    ){

        const start =
            i * chunkSize;

        const end =
            Math.min(
                start + chunkSize,
                buffer.byteLength
            );


        const chunk =
            buffer.slice(
                start,
                end
            );


        broadcast({

            type:"file",

            action:"chunk",

            fileId:fileId,

            index:i,

            total:total,

            data:chunk

        });


        /*
           Sedikit jeda supaya browser
           tidak terlalu dibebani.
        */

        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    3
                )
        );

    }


    broadcast({

        type:"file",

        action:"end",

        fileId:fileId

    });


    /*
       Tampilkan file pada pengirim.
    */

    showFileMessage(

        myName,

        file.name,

        file.size,

        file.type,

        buffer,

        true,

        timeNow()

    );


    input.value = "";

}


/* ===============================
   RECEIVE FILE
================================ */

const incomingFiles = {};


function receiveFile(data){

    const id =
        data.fileId;


    if(data.action === "start"){

        incomingFiles[id] = {

            name:data.name,

            size:data.size,

            mime:data.mime,

            total:data.total,

            sender:data.sender,

            time:data.time,

            chunks:[],

            received:0

        };

        return;

    }


    if(data.action === "chunk"){

        if(
            !incomingFiles[id]
        ){

            return;

        }


        incomingFiles[id]
            .chunks[data.index] =
            data.data;


        incomingFiles[id]
            .received++;


        return;

    }


    if(data.action === "end"){

        const file =
            incomingFiles[id];


        if(!file){

            return;

        }


        /*
           Gabungkan semua chunk.
        */

        const blob =
            new Blob(
                file.chunks,
                {
                    type:file.mime
                }
            );


        showFileMessage(

            file.sender,

            file.name,

            file.size,

            file.mime,

            blob,

            false,

            file.time

        );


        delete incomingFiles[id];

    }

}


/* ===============================
   FILE MESSAGE UI
================================ */

function showFileMessage(
    sender,
    name,
    size,
    mime,
    data,
    mine,
    time
){

    const container =
        document.getElementById(
            "messages"
        );


    const row =
        document.createElement("div");

    row.className =
        "message-row"
        + (mine ? " mine" : "");


    const message =
        document.createElement("div");

    message.className =
        "message";


    const blob =
        data instanceof Blob
        ? data
        : new Blob(
            [data],
            {
                type:mime
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const safeName =
        escapeHTML(name);


    message.innerHTML = `

        <div class="sender">
            ${escapeHTML(sender)}
        </div>

        <div class="file-card">

            <div class="file-icon">
                📄
            </div>

            <div class="file-info">

                <div class="file-name">
                    ${safeName}
                </div>

                <div class="file-size">
                    ${formatBytes(size)}
                </div>

            </div>

            <button
                class="download-btn"
                onclick="downloadFile(
                    '${url}',
                    '${safeName}'
                )">

                ⬇

            </button>

        </div>

        <div class="time">
            ${escapeHTML(time)}
        </div>

    `;


    row.appendChild(message);

    container.appendChild(row);

    container.scrollTop =
        container.scrollHeight;

}


function downloadFile(
    url,
    filename
){

    const a =
        document.createElement("a");

    a.href = url;

    a.download = filename;

    document.body.appendChild(a);

    a.click();

    a.remove();

}


/* ===============================
   MEMBERS
================================ */

function addMember(
    id,
    name,
    me=false
){

    users[id] = {

        name:name,

        me:me

    };


    renderMembers();

}


function removeMember(id){

    delete users[id];

    renderMembers();

}


function renderMembers(){

    const container =
        document.getElementById(
            "members"
        );


    container.innerHTML = "";


    Object.entries(users)
    .forEach(
        ([id,user]) => {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "member";


            const avatar =
                document.createElement(
                    "div"
                );

            avatar.className =
                "avatar";

            avatar.textContent =
                user.name
                .charAt(0)
                .toUpperCase();


            const info =
                document.createElement(
                    "div"
                );

            info.className =
                "member-info";


            info.innerHTML = `

                <div class="member-name">
                    ${escapeHTML(user.name)}
                    ${user.me ? " (Kamu)" : ""}
                </div>

                <div class="online">
                    ● online
                </div>

            `;


            item.appendChild(
                avatar
            );

            item.appendChild(
                info
            );


            container.appendChild(
                item
            );

        }
    );

}

}


/* ===============================
   COPY ROOM
================================ */

function copyRoom(){

    navigator.clipboard
    .writeText(roomId)
    .then(()=>{

        toast(
            "ID Room berhasil disalin."
        );

    })
    .catch(()=>{

        alert(
            "ID Room: " + roomId
        );

    });

}


/* ===============================
   LEAVE
================================ */

function leaveRoom(){

    if(
        peer
    ){

        try{

            peer.destroy();

        }catch(e){}

    }


    Object.values(
        connections
    ).forEach(conn => {

        try{

            conn.close();

        }catch(e){}

    });


    connections = {};

    users = {};

    document
        .getElementById("messages")
        .innerHTML = `
            <div class="system">
                Masuk ke room untuk mulai chatting.
            </div>
        `;


    document
        .getElementById("chatPage")
        .style.display = "none";


    document
        .getElementById("loginPage")
        .style.display = "flex";


    document
        .getElementById("passwordInput");

}
